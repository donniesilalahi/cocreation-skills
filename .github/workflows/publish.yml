name: Publish to npm

on:
  push:
    branches: [main]

# Don't let two pushes to main publish concurrently.
concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

# Least privilege. id-token is required for npm provenance attestation.
permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      - name: Validate skills
        run: node scripts/validate-skills.js

      - name: Check if version already exists on npm
        id: check
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if npm view @donniesilalahi/cocreation-skills@"$VERSION" version &> /dev/null; then
            echo "Version $VERSION already published. Skipping."
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "Version $VERSION is new. Will publish."
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish to npm
        if: steps.check.outputs.exists == 'false'
        run: npm publish --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
